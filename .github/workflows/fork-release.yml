name: Fork Release

on:
   workflow_dispatch:
      inputs:
         tag:
            description: Existing v* tag to build and publish
            required: true
            type: string

permissions:
   contents: read

concurrency:
   group: fork-release-${{ inputs.tag }}
   cancel-in-progress: false

jobs:
   validate:
      name: Validate release tag
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ inputs.tag }}
              fetch-depth: 0
         - name: Validate tag and package version
           shell: bash
           env:
              RELEASE_TAG: ${{ inputs.tag }}
           run: |
              set -euo pipefail
              version="$(jq -r .version packages/coding-agent/package.json)"
              test "$RELEASE_TAG" = "v$version"
              test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

   build:
      name: Build ${{ matrix.target_id }}
      needs: validate
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-22.04
                 target_id: linux-x64
                 native_targets: linux-x64-baseline linux-x64-modern
                 binary_path: packages/coding-agent/binaries/omp-linux-x64
                 smoke: host
               - os: ubuntu-22.04
                 target_id: linux-musl-x64
                 native_targets: linux-musl-x64-baseline
                 binary_path: packages/coding-agent/binaries/omp-linux-musl-x64
                 smoke: musl
               - os: ubuntu-24.04-arm
                 target_id: linux-arm64
                 native_targets: linux-arm64
                 binary_path: packages/coding-agent/binaries/omp-linux-arm64
                 smoke: host
               - os: ubuntu-24.04-arm
                 target_id: linux-musl-arm64
                 native_targets: linux-musl-arm64
                 binary_path: packages/coding-agent/binaries/omp-linux-musl-arm64
                 smoke: musl
               - os: ubuntu-22.04
                 target_id: win32-x64
                 native_targets: win32-x64-baseline
                 binary_path: packages/coding-agent/binaries/omp-windows-x64.exe
                 smoke: none
               - os: macos-15-intel
                 target_id: darwin-x64
                 native_targets: darwin-x64-baseline
                 binary_path: packages/coding-agent/binaries/omp-darwin-x64
                 smoke: host
               - os: macos-14
                 target_id: darwin-arm64
                 native_targets: darwin-arm64
                 binary_path: packages/coding-agent/binaries/omp-darwin-arm64
                 smoke: host
      runs-on: ${{ matrix.os }}
      timeout-minutes: 240
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ inputs.tag }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Cache Bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Build native addon
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: fork-release-${{ matrix.target_id }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary
           if: startsWith(matrix.target_id, 'darwin-') && env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Smoke release binary
           if: matrix.smoke == 'host'
           shell: bash
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl release binary
           if: matrix.smoke == 'musl'
           shell: bash
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              docker run --rm -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload release binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
              if-no-files-found: error

   publish:
      name: Publish fork release
      needs: build
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ inputs.tag }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Build browser relay extension
           run: bun run --cwd packages/browser-relay build
         - name: Verify asset set
           shell: bash
           run: |
              set -euo pipefail
              for asset in \
                omp-darwin-arm64 \
                omp-darwin-x64 \
                omp-linux-arm64 \
                omp-linux-musl-arm64 \
                omp-linux-musl-x64 \
                omp-linux-x64 \
                omp-windows-x64.exe; do
                 test -s "packages/coding-agent/binaries/$asset"
              done
              test -s packages/browser-relay/dist/omp-browser-relay-extension.zip
              test -s LICENSE
              test -s THIRD-PARTY-NOTICES.txt
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/omp-* \
                packages/browser-relay/dist/omp-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Generate release notes
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: ${{ inputs.tag }}
           run: |
              set -euo pipefail
              {
                 echo "Fork release based on [upstream $RELEASE_TAG](https://github.com/can1357/oh-my-pi/releases/tag/$RELEASE_TAG)."
                 echo
                 echo "## Fork changes"
                 echo
                 echo "- Fixed status and composer colors turning into solid accent-colored backgrounds in Terminal.app versions without 24-bit color support."
                 echo
                 echo "---"
                 echo
                 gh release view "$RELEASE_TAG" --repo can1357/oh-my-pi --json body --jq .body
              } > release-notes.md
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ inputs.tag }}
              name: ${{ inputs.tag }}
              body_path: release-notes.md
              files: |
                 packages/coding-agent/binaries/omp-*
                 packages/browser-relay/dist/omp-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
