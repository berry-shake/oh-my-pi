name: Fork Release

on:
   workflow_dispatch:
      inputs:
         tag:
            description: Existing mod-v* tag to build and publish
            required: true
            type: string

permissions:
   contents: read

concurrency:
   group: fork-release-${{ inputs.tag }}
   cancel-in-progress: false

jobs:
   validate:
      name: Validate release tag
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ inputs.tag }}
              fetch-depth: 0
         - name: Validate tag and package version
           shell: bash
           env:
              RELEASE_TAG: ${{ inputs.tag }}
           run: |
              set -euo pipefail
              version="$(jq -r .version packages/coding-agent/package.json)"
              upstream_tag="v$version"
              test "$RELEASE_TAG" = "mod-$upstream_tag"
              test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
              upstream_commit="$(git ls-remote https://github.com/can1357/oh-my-pi.git "refs/tags/$upstream_tag" "refs/tags/$upstream_tag^{}" | tail -n 1 | cut -f 1)"
              test -n "$upstream_commit"
              test "$(git rev-list -n 1 "$upstream_tag")" = "$upstream_commit"

   build:
      name: Build ${{ matrix.target_id }}
      needs: validate
      strategy:
         fail-fast: false
         matrix:
            include:
               - target_id: linux-x64
                 native_targets: linux-x64-baseline linux-x64-modern
                 binary_path: packages/coding-agent/binaries/omp-linux-x64
               - target_id: linux-musl-x64
                 native_targets: linux-musl-x64-baseline
                 binary_path: packages/coding-agent/binaries/omp-linux-musl-x64
               - target_id: linux-arm64
                 native_targets: linux-arm64
                 binary_path: packages/coding-agent/binaries/omp-linux-arm64
               - target_id: linux-musl-arm64
                 native_targets: linux-musl-arm64
                 binary_path: packages/coding-agent/binaries/omp-linux-musl-arm64
               - target_id: win32-x64
                 native_targets: win32-x64-baseline
                 binary_path: packages/coding-agent/binaries/omp-windows-x64.exe
               - target_id: win32-arm64
                 native_targets: win32-arm64
                 binary_path: packages/coding-agent/binaries/omp-windows-arm64.exe
               - target_id: darwin-x64
                 native_targets: darwin-x64-baseline
                 binary_path: packages/coding-agent/binaries/omp-darwin-x64
               - target_id: darwin-arm64
                 native_targets: darwin-arm64
                 binary_path: packages/coding-agent/binaries/omp-darwin-arm64
      runs-on: ubuntu-22.04
      timeout-minutes: 240
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ inputs.tag }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Cache Bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Compose Bazel configuration
           id: bazel
           uses: ./.github/actions/bazel-cache
         - name: Build native addon
           env:
              OMP_BAZEL_RC: ${{ steps.bazel.outputs.rc }}
              NATIVE_TARGETS: ${{ matrix.native_targets }}
           run: |
              set -euo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              read -r -a targets <<< "$NATIVE_TARGETS"
              bun scripts/bazel-natives.ts "${targets[@]}" --dest packages/natives/native
         - name: Install Mach-O inspection tool
           if: matrix.target_id == 'darwin-arm64'
           run: sudo apt-get update && sudo apt-get install --no-install-recommends -y llvm
         - name: Verify Apple Foundation Models bridge
           if: matrix.target_id == 'darwin-arm64'
           run: |
              set -euo pipefail
              addon=packages/natives/native/pi_natives.darwin-arm64.node
              # The bridge is embedded as a separate dylib (module OmpAppleFm),
              # never linked: a linked Swift runtime crashes the addon on load
              # on older macOS.
              grep -aqF OmpAppleFm "$addon" ||
                 { echo "::error::Darwin arm64 addon was built without the Apple Foundation Models bridge"; exit 1; }
              dylibs="$(llvm-objdump --macho --dylibs-used "$addon")"
              if grep -E 'libswift|FoundationModels' <<< "$dylibs"; then
                 echo "::error::Darwin arm64 addon links the Swift runtime or FoundationModels directly"; exit 1
              fi
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign macOS binary
           if: startsWith(matrix.target_id, 'darwin-')
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Upload release binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
              if-no-files-found: error

   smoke:
      name: Smoke ${{ matrix.target_id }}
      needs: build
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-22.04, target_id: linux-x64, binary: omp-linux-x64 }
               - { os: ubuntu-24.04-arm, target_id: linux-arm64, binary: omp-linux-arm64 }
               - { os: ubuntu-22.04, target_id: linux-musl-x64, binary: omp-linux-musl-x64, alpine: true }
               - { os: ubuntu-24.04-arm, target_id: linux-musl-arm64, binary: omp-linux-musl-arm64, alpine: true }
               - { os: macos-15-intel, target_id: darwin-x64, binary: omp-darwin-x64 }
               - { os: macos-15, target_id: darwin-arm64, binary: omp-darwin-arm64 }
               - { os: windows-2025, target_id: win32-x64, binary: omp-windows-x64.exe }
               - { os: windows-11-arm, target_id: win32-arm64, binary: omp-windows-arm64.exe }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: binaries
         - name: Smoke release binary
           if: runner.os != 'Windows' && !matrix.alpine
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              set -euo pipefail
              chmod +x "$BINARY"
              if [ "$RUNNER_OS" = macOS ]; then codesign --verify --strict --verbose=2 "$BINARY"; fi
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
         - name: Smoke musl release binary
           if: matrix.alpine
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              chmod +x "$BINARY"
              docker run --rm -v "$(realpath "$BINARY"):/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Smoke release binary (Windows)
           if: runner.os == 'Windows'
           shell: pwsh
           env:
              BINARY: binaries/${{ matrix.binary }}
           run: |
              $runtimeDir = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtimeDir "home"
              $env:USERPROFILE = $env:HOME
              $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
              $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
              New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
              & $env:BINARY --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $env:BINARY --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

   publish:
      name: Publish fork release
      needs: [build, smoke]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ inputs.tag }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Build browser relay extension
           run: bun run --cwd packages/browser-relay build
         - name: Verify asset set
           shell: bash
           run: |
              set -euo pipefail
              for asset in \
                omp-darwin-arm64 \
                omp-darwin-x64 \
                omp-linux-arm64 \
                omp-linux-musl-arm64 \
                omp-linux-musl-x64 \
                omp-linux-x64 \
                omp-windows-arm64.exe \
                omp-windows-x64.exe; do
                 test -s "packages/coding-agent/binaries/$asset"
              done
              test -s packages/browser-relay/dist/omp-browser-relay-extension.zip
              test -s LICENSE
              test -s THIRD-PARTY-NOTICES.txt
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/omp-* \
                packages/browser-relay/dist/omp-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Generate release notes
           id: release
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              set -euo pipefail
              version="$(jq -r .version packages/coding-agent/package.json)"
              upstream_tag="v$version"
              echo "name=$upstream_tag (mod)" >> "$GITHUB_OUTPUT"
              {
                 echo "Fork release based on [upstream $upstream_tag](https://github.com/can1357/oh-my-pi/releases/tag/$upstream_tag)."
                 echo
                 echo "## Fork status"
                 echo
                 echo "- Package versions and upstream tag positions are unchanged."
                 echo "- The Terminal.app session-accent fix previously carried by this fork is included upstream."
                 echo
                 echo "---"
                 echo
                 gh release view "$upstream_tag" --repo can1357/oh-my-pi --json body --jq .body
              } > release-notes.md
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ inputs.tag }}
              name: ${{ steps.release.outputs.name }}
              body_path: release-notes.md
              files: |
                 packages/coding-agent/binaries/omp-*
                 packages/browser-relay/dist/omp-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
